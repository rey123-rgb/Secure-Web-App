{% extends "base.html" %}
{% block content %}

<div class="card mx-auto shadow p-4" style="max-width: 400px;">
    <h3 class="text-center mb-3">Register</h3>

    <form method="POST">
        <input class="form-control mb-3" type="text" name="username" placeholder="Username" required>

        <input class="form-control mb-2" type="password" name="password" id="password" placeholder="Password" required>

        <!-- Password strength bar -->
        <div class="progress mb-3">
            <div id="strength-bar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
        </div>
        <small id="strength-text" class="text-muted"></small>

        <select class="form-select mb-3" name="role" required>
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select>

        <button class="btn btn-dark w-100" type="submit">Register</button>
    </form>

    <div class="text-center mt-3">
        <a href="{{ url_for('login') }}">Already have an account? Login</a>
    </div>
</div>

<!-- Password strength script -->
<script>
const password = document.getElementById("password");
const strengthBar = document.getElementById("strength-bar");
const strengthText = document.getElementById("strength-text");

password.addEventListener("input", () => {
    const val = password.value;
    let score = 0;

    if (val.length >= 6) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    // Update progress bar
    let width = (score / 4) * 100;
    strengthBar.style.width = width + "%";

    // Update color and text
    if (score <= 1) {
        strengthBar.className = "progress-bar bg-danger";
        strengthText.innerText = "Weak";
    } else if (score == 2 || score == 3) {
        strengthBar.className = "progress-bar bg-warning";
        strengthText.innerText = "Medium";
    } else {
        strengthBar.className = "progress-bar bg-success";
        strengthText.innerText = "Strong";
    }
});
</script>

{% endblock %}
